
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يومي المنظّم</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#62d6a5}
.card{background:#1c293b;padding:17px;margin:14px 0;border-radius:15px}
h2{font-size:19px;color:#62d6a5;margin-top:0}
label{display:flex;align-items:center;gap:10px;margin:13px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:#62d6a5}
input[type=number],input[type=text],input[type=date]{width:100%;padding:12px;border:0;border-radius:9px;margin:7px 0;background:#eef2f7;color:#111;font-size:16px}
button{padding:12px 18px;border:0;border-radius:9px;background:#62d6a5;color:#102033;font-weight:bold;margin:5px;cursor:pointer}
.result{font-size:20px;color:#62d6a5;font-weight:bold}
.small{color:#b8c5d6;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🌟 يومي المنظّم</h1>
<p style="text-align:center">نظّم يومك وراقب تطوّرك كل يوم</p>

<div class="card">
<h2>📅 التاريخ</h2>
<input type="date" id="date">
</div>

<div class="card">
<h2>🕌 الصلوات</h2>
<div id="prayers">
<label><input type="checkbox"> الفجر</label>
<label><input type="checkbox"> الظهر</label>
<label><input type="checkbox"> العصر</label>
<label><input type="checkbox"> المغرب</label>
<label><input type="checkbox"> العشاء</label>
</div>
</div>

<div class="card">
<h2>💪 الصحة والعناية بالنفس</h2>
<div id="health">
<label><input type="checkbox"> الرياضة أو النادي</label>
<label><input type="checkbox"> الاستحمام</label>
<label><input type="checkbox"> تنظيف الأسنان</label>
<label><input type="checkbox"> شرب الماء</label>
<label><input type="checkbox"> أكل صحي</label>
</div>
</div>

<div class="card">
<h2>📚 التعلّم وتطوير المهارات</h2>
<label><input type="checkbox"> تعلمت شيئاً جديداً</label>
<input type="text" placeholder="ما المهارة التي تعلمتها اليوم؟" id="skill">
</div>

<div class="card">
<h2>💼 العمل</h2>
<label><input type="checkbox"> أنهيت العمل قبل الساعة 18:00</label>
<label><input type="checkbox"> أنهيت العمل بعد الساعة 18:00</label>
</div>

<div class="card">
<h2>🚬 تقليل التدخين</h2>
<label>عدد السجائر اليوم:</label>
<input type="number" id="cigarettes" min="0" placeholder="مثلاً 20">
<p class="small">سجّل العدد يومياً لمتابعة انخفاضه.</p>
</div>

<div class="card">
<h2>⏰ النوم والاستيقاظ</h2>
<label><input type="checkbox"> استيقظت قبل 09:00</label>
<label><input type="checkbox"> استيقظت بعد 09:00</label>
<label><input type="checkbox"> وصلت إلى المنزل قبل 23:00</label>
<label><input type="checkbox"> وصلت إلى المنزل بعد 23:00</label>
<label><input type="checkbox"> نمت قبل منتصف الليل</label>
<label><input type="checkbox"> نمت بعد منتصف الليل</label>
</div>

<div class="card">
<h2>💰 المصاريف والأرباح (دج)</h2>
<label>المبلغ الذي كسبته اليوم:</label>
<input type="number" id="income" min="0" placeholder="0">
<label>المبلغ الذي صرفته اليوم:</label>
<input type="number" id="expenses" min="0" placeholder="0">
<p>المتبقي: <span class="result" id="balance">0 دج</span></p>
</div>

<div class="card">
<h2>📊 إنجازات اليوم</h2>
<p id="progress">0%</p>
<button onclick="saveDay()">💾 حفظ اليوم</button>
<button onclick="loadDay()">📂 استرجاع اليوم</button>
<button onclick="resetDay()">🔄 يوم جديد</button>
<p class="small" id="message"></p>
</div>
</div>

<script>
const dateInput=document.getElementById('date');
const today=()=>new Date().toLocaleDateString('en-CA');
dateInput.value=today();

function fields(){
 return [...document.querySelectorAll('input[type=checkbox]')];
}
function update(){
 const all=fields();
 const done=all.filter(x=>x.checked).length;
 document.getElementById('progress').textContent=
 Math.round(done/all.length*100)+'% من المهام';
 const income=Number(document.getElementById('income').value)||0;
 const expenses=Number(document.getElementById('expenses').value)||0;
 document.getElementById('balance').textContent=(income-expenses)+' دج';
}
function key(){return 'yawmi-'+dateInput.value;}
function saveDay(){
 const data={
 checks:fields().map(x=>x.checked),
 skill:document.getElementById('skill').value,
 cigarettes:document.getElementById('cigarettes').value,
 income:document.getElementById('income').value,
 expenses:document.getElementById('expenses').value
 };
 localStorage.setItem(key(),JSON.stringify(data));
 document.getElementById('message').textContent='تم حفظ بيانات هذا اليوم على هذا الجهاز ✅';
}
function loadDay(){
 const raw=localStorage.getItem(key());
 if(!raw){document.getElementById('message').textContent='لا توجد بيانات محفوظة لهذا اليوم';return;}
 const data=JSON.parse(raw);
 fields().forEach((x,i)=>x.checked=!!data.checks[i]);
 document.getElementById('skill').value=data.skill||'';
 document.getElementById('cigarettes').value=data.cigarettes||'';
 document.getElementById('income').value=data.income||'';
 document.getElementById('expenses').value=data.expenses||'';
 update();
 document.getElementById('message').textContent='تم استرجاع بيانات اليوم ✅';
}
function resetDay(){
 if(!confirm('هل تريد مسح بيانات هذا اليوم من الشاشة؟'))return;
 fields().forEach(x=>x.checked=false);
 ['skill','cigarettes','income','expenses'].forEach(id=>document.getElementById(id).value='');
 update();
 document.getElementById('message').textContent='تم تصفير الشاشة. احفظ إذا أردت تسجيل يوم جديد.';
}
fields().forEach(x=>x.addEventListener('change',update));
['income','expenses'].forEach(id=>document.getElementById(id).addEventListener('input',update));
dateInput.addEventListener('change',loadDay);
update();
loadDay();
</script>
</body>
</html>
